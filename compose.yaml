name: dasigochim

services:
  backend:
    image: dasigochim/backend:${IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dasigochim}
      DB_USERNAME: ${POSTGRES_USER:-dasigochim}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dasigochim}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5175}
      # 심사위원 게스트 로그인. 꺼져 있으면 /api/v1/auth/guest 자체가 등록되지 않는다.
      GUEST_LOGIN_ENABLED: ${GUEST_LOGIN_ENABLED:-false}
      GUEST_ACCESS_CODE: ${GUEST_ACCESS_CODE:-}
      GUEST_ADMIN_DEPARTMENT_CODE: ${GUEST_ADMIN_DEPARTMENT_CODE:-FACILITY}
      FILE_UPLOAD_DIR: /app/uploads
      # mock | http. http 면 ai-server 를 실제로 호출한다 (ai-server 를 먼저 띄울 것).
      AI_MODE: ${AI_MODE:-mock}
      # ai-server 는 별도 compose 프로젝트라 호스트 포워딩된 포트로 나갔다 들어온다.
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://host.docker.internal:8000}
      # AI 서버가 /internal/** 를 부를 때 제시하는 토큰. ai-server 의 .env 와 같은 값.
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dasigochim-uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    # pgvector 확장이 포함된 이미지. 같은 PG 16 이라 볼륨은 그대로 재사용한다.
    # 주의: alpine(musl) → Debian(glibc) 이라 텍스트 인덱스 정렬 구현이 바뀐다.
    # 교체 후 REINDEX DATABASE 를 한 번 돌릴 것 (데이터가 적을 때 해야 순식간에 끝난다).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dasigochim}
      POSTGRES_USER: ${POSTGRES_USER:-dasigochim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dasigochim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dasigochim-postgres:/var/lib/postgresql/data

volumes:
  dasigochim-postgres:
  dasigochim-uploads:
